    <!-- Structured Data - FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Quanto custa automatizar processos na minha empresa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O investimento varia conforme a complexidade das automações. Começamos com diagnóstico gratuito para entender seus processos e apresentar uma proposta sob medida. Pequenas automatizações podem começar a partir de R$ 1.500, enquanto integrações complexas têm valores personalizados."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto tempo leva para implementar uma automação?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Automações simples (como integração WhatsApp + planilha) podem ficar prontas em 1-2 semanas. Projetos mais complexos com múltiplas integrações levam de 3-6 semanas. Tudo depende do escopo definido no diagnóstico inicial."
          }
        },
        {
          "@type": "Question",
          "name": "Quais sistemas vocês conseguem integrar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Integramos praticamente qualquer sistema: CRMs (RD Station, HubSpot, Pipedrive), WhatsApp Business, Google Sheets, ERPs, plataformas de e-commerce, APIs customizadas e mais de 400 aplicações via n8n. Se tem API ou webhook, conseguimos conectar."
          }
        },
        {
          "@type": "Question",
          "name": "Preciso contratar planos caros de automação?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não necessariamente. Trabalhamos com n8n que tem versão self-hosted gratuita. Para pequenas empresas, isso significa baixo custo de infraestrutura. Você paga apenas pelo desenvolvimento da automação e suporte, sem mensalidades abusivas de plataformas no-code."
          }
        }
      ]
    }
    </script>
