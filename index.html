    <!-- Structured Data - FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Quanto custa o marketing imobiliário da Eknotech?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Trabalhamos com planos mensais Growth que combinam criação de vídeos, tráfego pago, automação com IA e gestão de contratos, além de projetos sob demanda. Começamos com um diagnóstico gratuito da sua operação e apresentamos o plano adequado ao seu momento. A verba de mídia dos anúncios é investida diretamente por você nas plataformas."
          }
        },
        {
          "@type": "Question",
          "name": "Em quanto tempo minha imobiliária começa a receber leads?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "As primeiras campanhas entram no ar ainda no primeiro mês, junto com os primeiros vídeos dos seus imóveis. No segundo mês ativamos o agente de WhatsApp com IA para que nenhum lead fique sem resposta, e no terceiro a operação completa está rodando."
          }
        },
        {
          "@type": "Question",
          "name": "Preciso produzir os vídeos dos imóveis no local?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. Produzimos vídeos profissionais a partir das fotos que você já tem dos imóveis — zero logística para sua equipe. A entrega é em até 48h, em formato vertical (Reels, Stories, WhatsApp) e horizontal (YouTube, site, portais)."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona o atendimento com IA no WhatsApp?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Um agente de IA treinado com o seu portfólio de imóveis responde na hora, 24 horas por dia, qualifica o interesse do cliente (região, faixa de preço, finalidade) e entrega o lead filtrado para sua equipe fechar a venda ou locação."
          }
        }
      ]
    }
