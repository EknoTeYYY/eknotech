    <!-- Structured Data - FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O que a Eknotech faz?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Somos uma empresa de tecnologia e IA. Desenvolvemos, mantemos e evoluímos um portfólio de produtos próprios (Gedfy, Athelium e Gridgen), cada um resolvendo um problema específico com automação inteligente e agentes de IA."
          }
        },
        {
          "@type": "Question",
          "name": "A Eknotech desenvolve produtos sob encomenda para outras empresas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. A Eknotech é uma empresa de produtos: não atuamos como agência ou consultoria sob demanda. Desenvolvemos, mantemos e evoluímos nosso próprio portfólio de tecnologia e IA."
          }
        },
        {
          "@type": "Question",
          "name": "Como posso conhecer os produtos da Eknotech?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Você pode navegar pela seção de produtos no site e acessar diretamente Gedfy, Athelium ou Gridgen para conhecer cada solução em detalhe, ou falar diretamente com a equipe pelo WhatsApp."
          }
        },
        {
          "@type": "Question",
          "name": "Qual é o produto mais recente da Eknotech?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Gridgen é o mais recente produto do nosso portfólio, ao lado de Gedfy e Athelium. Todos são desenvolvidos e mantidos pela Eknotech."
          }
        }
      ]
    }
